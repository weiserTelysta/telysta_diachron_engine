# 语法化路由配置
# 格式：语义基元 → 语法功能，按类型学分支决定产物形态
#
# typology_output 三条路由：
#   isolating    → free_particle     (孤立语：独立虚词，不附着)
#   agglutinative → suffix / prefix  (黏着语：规则词缀)
#   fusional     → stem_alternation / case_ending (屈折语：词根变形/格尾)
#
# trigger 触发条件（AND关系）：
#   max_true_freq_rank : 候选词的频率排名须 <= 此值（排名越小越高频）
#   min_erosion_stage  : 累积音变步数须 >= 此值（len(ipa_history)）
#
# 所有 semantic_prime 必须与 swadesh_207.json 中的 "en" 字段大小写匹配（忽略大小写）。

version: "1.0"

pathways:

  - id: "come_to_directional"
    semantic_prime: "come"
    description: "来向动词 → 方向/趋向标记（近指来向规律）"
    examples:
      zh: "来（移动→来向标记）"
      en: "come → allative marker"
    target_function: "locative"
    typology_output:
      isolating: "free_particle"
      agglutinative: "suffix"
      fusional: "case_ending"
    trigger:
      max_true_freq_rank: 30
      min_erosion_stage: 3

  - id: "walk_to_future"
    semantic_prime: "walk"
    description: "行走动词 → 将来时/方向标记（位移变将来规律）"
    examples:
      zh: "走（移动→将要）"
      en: "going to (walk → future marker)"
    target_function: "tense_marker"
    typology_output:
      isolating: "free_particle"
      agglutinative: "prefix"
      fusional: "prefix"
    trigger:
      max_true_freq_rank: 50
      min_erosion_stage: 3

  - id: "see_to_evidential"
    semantic_prime: "see"
    description: "感知动词 → 直证据标记（视觉→认识论规律）"
    examples:
      en: "see → evidential marker (I see → I know for sure)"
    target_function: "aspect_marker"
    typology_output:
      isolating: "free_particle"
      agglutinative: "suffix"
      fusional: "stem_alternation"
    trigger:
      max_true_freq_rank: 60
      min_erosion_stage: 3

  - id: "die_to_perfective"
    semantic_prime: "die"
    description: "死亡动词 → 完成体/终结体标记（完结→完成规律）"
    examples:
      zh: "完（完结→动作完成标记）"
      en: "die → completive / perfective marker"
    target_function: "aspect_marker"
    typology_output:
      isolating: "free_particle"
      agglutinative: "suffix"
      fusional: "stem_alternation"
    trigger:
      max_true_freq_rank: 100
      min_erosion_stage: 3

  - id: "hold_to_case"
    semantic_prime: "hold"
    description: "握持动词 → 宾格/工具格标记"
    examples:
      zh: "把（握住→宾语引出标记）"
      en: "with (accompany → instrumental)"
    target_function: "case_marker"
    typology_output:
      isolating: "free_particle"
      agglutinative: "suffix"
      fusional: "case_ending"
    trigger:
      max_true_freq_rank: 120
      min_erosion_stage: 3

  - id: "give_to_benefactive"
    semantic_prime: "give"
    description: "给予动词 → 与格/受益格标记"
    examples:
      zh: "给（给予→受益者标记）"
    target_function: "case_marker"
    typology_output:
      isolating: "free_particle"
      agglutinative: "suffix"
      fusional: "case_ending"
    trigger:
      max_true_freq_rank: 40
      min_erosion_stage: 3

  - id: "say_to_quotative"
    semantic_prime: "say"
    description: "言说动词 → 引语标记/从句连词"
    examples:
      en: "that (say → complementizer)"
    target_function: "subordinator"
    typology_output:
      isolating: "free_particle"
      agglutinative: "suffix"
      fusional: "prefix"
    trigger:
      max_true_freq_rank: 40
      min_erosion_stage: 3
