name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run required checks
        run: poetry run python scripts/check.py

  rust:
    name: Rust 1.77.2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.77.2 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.77.2 fmt --all --check

      - name: Run workspace tests
        run: cargo +1.77.2 test --workspace --locked

      - name: Run Clippy
        run: cargo +1.77.2 clippy --workspace --all-targets --locked -- -D warnings

      - name: Check desktop JavaScript
        run: node --check apps/desktop/web/app.js

  gate-evidence:
    name: G0A diagnostic evidence
    if: github.event_name == 'workflow_dispatch'
    needs:
      - python
      - rust
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact subject revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Poetry and project dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.77.2 --profile minimal --component rustfmt,clippy

      - name: Generate subject-bound diagnostic evidence
        run: poetry run python scripts/generate_gate_evidence.py --verify

      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: g0a-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/G0A_GATE_EVIDENCE_2026-07-17.json
            docs/STATUS.md

  decision:
    name: CI decision
    if: always()
    needs:
      - python
      - rust
      - gate-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all applicable jobs
        shell: bash
        run: |
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          if test "${{ github.event_name }}" = "workflow_dispatch"; then
            test "${{ needs.gate-evidence.result }}" = "success"
          else
            test "${{ needs.gate-evidence.result }}" = "skipped"
          fi
