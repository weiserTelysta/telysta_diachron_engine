name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run required checks
        run: poetry run python -I scripts/check.py

  rust:
    name: Rust ${{ matrix.lane }} (${{ matrix.toolchain }}) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lane: msrv
            toolchain: "1.88.0"
            run_fmt: true
          - os: windows-2025
            lane: msrv
            toolchain: "1.88.0"
            run_fmt: true
          - os: ubuntu-24.04
            lane: stable
            toolchain: stable
            run_fmt: false
          - os: windows-2025
            lane: stable
            toolchain: stable
            run_fmt: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install selected Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy

      - name: Report active Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose

      - name: Assert exact MSRV toolchain
        if: matrix.lane == 'msrv'
        shell: pwsh
        run: |
          $actualRustc = (rustc --version).Split()[1]
          $actualCargo = (cargo --version).Split()[1]
          if ($actualRustc -ne "1.88.0") {
            throw "Expected rustc 1.88.0, got $actualRustc"
          }
          if ($actualCargo -ne "1.88.0") {
            throw "Expected cargo 1.88.0, got $actualCargo"
          }

      - name: Check formatting with MSRV toolchain
        if: matrix.run_fmt
        run: cargo fmt --all --check

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build desktop shell
        run: cargo build -p telysta-desktop --locked

      - name: Check desktop JavaScript
        if: matrix.lane == 'stable' && runner.os == 'Linux'
        run: node --check apps/desktop/web/app.js

      - name: Assert Rust gates did not modify tracked inputs
        run: git diff --exit-code

  gate-evidence:
    name: G0A diagnostic evidence
    if: github.event_name == 'workflow_dispatch'
    needs:
      - python
      - rust
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"

    steps:
      - name: Check out exact subject revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry and project dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Assert exact gate-evidence Rust toolchain
        shell: pwsh
        run: |
          $actualRustc = (rustc --version).Split()[1]
          $actualCargo = (cargo --version).Split()[1]
          if ($actualRustc -ne "1.88.0") {
            throw "Expected rustc 1.88.0, got $actualRustc"
          }
          if ($actualCargo -ne "1.88.0") {
            throw "Expected cargo 1.88.0, got $actualCargo"
          }
          rustc --version --verbose
          cargo --version --verbose

      - name: Generate subject-bound diagnostic evidence
        run: poetry run python -I scripts/generate_gate_evidence.py --verify

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0a-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/G0A_GATE_EVIDENCE_2026-07-17.json
            docs/STATUS.md

  decision:
    name: CI decision
    if: always()
    needs:
      - python
      - rust
      - gate-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all applicable jobs
        shell: bash
        run: |
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          if test "${{ github.event_name }}" = "workflow_dispatch"; then
            test "${{ needs.gate-evidence.result }}" = "success"
          else
            test "${{ needs.gate-evidence.result }}" = "skipped"
          fi
