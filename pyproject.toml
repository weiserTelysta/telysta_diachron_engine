[tool.poetry]
name = "telystalexisengine"
version = "0.1.0"
description = "A neuro-symbolic engine for automated conlang evolution and synthesis."
authors = ["weiser <weiser@telysta.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.24"
pyyaml = ">=6.0"
streamlit = ">=1.30"

[tool.poetry.dev-dependencies]
pytest = ">=7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"