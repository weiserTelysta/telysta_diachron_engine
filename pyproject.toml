[project]
name = "telysta-diachron-engine"
version = "0.1.0"
description = "A neuro-symbolic engine for automated conlang evolution and synthesis."
authors = [
    { name = "weiser", email = "weiser@telysta.com" },
]
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=1.24,<3.0",
    "pyyaml>=6.0,<7.0",
    "streamlit>=1.30,<2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
    "tomli>=2.4.1,<3.0; python_version < '3.11'",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Start with correctness-critical diagnostics. Broader style cleanup belongs
# to the dedicated cleanup phase and must not obscure behavioral changes.
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
